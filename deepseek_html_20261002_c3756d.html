<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>消失的墨水 · Fading Ink</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f7f5f0;--card:#fff;--ink:#1a2332;--muted:#7d8593;
  --line:#e7e2d8;--accent:#0f766e;--accent2:#14b8a6;
  --warn:#dc2626;--ok:#16a34a;

  --reading-size:18px;
  --reading-line:2.15;

  --hint-bg:linear-gradient(135deg,#f0fdfa,#e6fffa);
  --hint-border:#bcd9d4;
  --hint-text:#0b5f59;
  --hint-strong:#0f766e;
  --chip-bg:#f0fdfa;
  --chip-text:#0b5f59;
  --badge-bg:#fef3c7;
  --badge-text:#92400e;
  --badge-off-bg:#e7e2d8;
  --badge-off-text:#7d8593;
  --mask-bg:#f1f5f9;
  --mask-text:#94a3b8;
  --mask-border:#94a3b8;
  --real-bg:#e6fffa;
  --real-text:#0b5f59;
  --speaking-bg:#fef3c7;
  --speaking-shadow:rgba(251,191,36,.4);
  --hover-bg:#e6fffa;
  --toast-bg:#1a2332;
  --toast-text:#fff;
  --drag-handle:#bcb5a8;
  --drag-handle-hover:#94a3b8;
  --shadow-card:0 10px 24px rgba(15,118,110,.1);
  --shadow-panel:0 12px 32px rgba(0,0,0,.12);

  --karaoke-bg:#fbbf24;
  --karaoke-text:#1a2332;
  --karaoke-ring:rgba(251,191,36,.45);

  --mastered-bg:#f0fdf4;
  --mastered-border:#86efac;
  --mastered-text:#16a34a;
}
html[data-theme="dark"]{
  --bg:#15171c;
  --card:#1e2128;
  --ink:#e6e8ec;
  --muted:#8b929e;
  --line:#2d323c;
  --accent:#2dd4bf;
  --accent2:#5eead4;
  --warn:#f87171;
  --ok:#4ade80;

  --hint-bg:linear-gradient(135deg,rgba(45,212,191,.12),rgba(94,234,212,.06));
  --hint-border:rgba(45,212,191,.35);
  --hint-text:#5eead4;
  --hint-strong:#5eead4;
  --chip-bg:rgba(45,212,191,.12);
  --chip-text:#5eead4;
  --badge-bg:rgba(251,191,36,.18);
  --badge-text:#fbbf24;
  --badge-off-bg:#2d323c;
  --badge-off-text:#8b929e;
  --mask-bg:rgba(148,163,184,.18);
  --mask-text:#94a3b8;
  --mask-border:#5d6470;
  --real-bg:rgba(45,212,191,.18);
  --real-text:#5eead4;
  --speaking-bg:rgba(251,191,36,.22);
  --speaking-shadow:rgba(251,191,36,.35);
  --hover-bg:rgba(45,212,191,.1);
  --toast-bg:#0f1115;
  --toast-text:#e6e8ec;
  --drag-handle:#5d6470;
  --drag-handle-hover:#8b929e;
  --shadow-card:0 10px 24px rgba(0,0,0,.4);
  --shadow-panel:0 12px 32px rgba(0,0,0,.55);

  --karaoke-bg:#fbbf24;
  --karaoke-text:#15171c;
  --karaoke-ring:rgba(251,191,36,.5);

  --mastered-bg:rgba(74,222,128,.1);
  --mastered-border:rgba(74,222,128,.4);
  --mastered-text:#4ade80;
}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background .25s, color .25s;
}
.topbar{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb, var(--bg) 93%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:14px;
  min-height:56px;
}
.brand{
  font-weight:800;font-size:15px;letter-spacing:.2px;
  display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
}
.brand::before{
  content:"";width:11px;height:11px;border-radius:4px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.brand .sub{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.5px}
.spacer{flex:1}
#topbarActions{display:flex;gap:8px;align-items:center}

.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 17px;border-radius:11px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 5px 16px rgba(15,118,110,.22)}
.btn.primary:hover{background:var(--accent);filter:brightness(.92);color:#fff}
.btn.small{padding:6px 12px;font-size:12px;border-radius:9px}
.btn.big{padding:12px 26px;font-size:14.5px;border-radius:999px}
.btn.danger{border-color:#fca5a5;color:#dc2626}
.btn.danger:hover{background:#fef2f2;border-color:#dc2626;color:#dc2626}
.btn.icon-btn{
  padding:6px 10px;font-size:15px;line-height:1;min-width:34px;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn.playing{
  background:var(--warn);
  color:#fff;
  border-color:var(--warn);
}
.btn.playing:hover{
  background:var(--warn);
  filter:brightness(.92);
  color:#fff;
  border-color:var(--warn);
}
.btn:disabled{opacity:.45;cursor:not-allowed}

main{max-width:960px;margin:0 auto;padding:24px 16px 100px}

.library-head{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;
  flex-wrap:wrap;
}
.library-head h2{
  font-size:19px;margin:0;letter-spacing:-.2px;
  display:flex;align-items:baseline;gap:8px;
}
.library-head .count{
  font-size:13px;color:var(--muted);font-weight:600;
}
.library-head .head-actions{
  margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;
}
.library-head .hint{
  font-size:11.5px;font-weight:600;
  background:var(--chip-bg);color:var(--chip-text);
  padding:5px 12px;border-radius:999px;letter-spacing:.2px;
}
.doc-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;
}
.doc-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:18px;
  cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  user-select:none;
}
.doc-card:hover{
  border-color:var(--hint-border);transform:translateY(-2px);
  box-shadow:var(--shadow-card);
}
.doc-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  opacity:0;transition:opacity .18s;
}
.doc-card:hover::before{opacity:1}

.doc-card.draggable{cursor:grab}
.doc-card.draggable:active{cursor:grabbing}
.doc-card.dragging{
  opacity:0.35;
  transform:scale(0.98);
  cursor:grabbing;
}
.doc-card.drop-before::after,
.doc-card.drop-after::after{
  content:"";position:absolute;left:12px;right:12px;
  height:3px;background:var(--accent);border-radius:3px;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  z-index:5;
}
.doc-card.drop-before::after{top:-6px}
.doc-card.drop-after::after{bottom:-6px}

.doc-title{
  font-size:15px;font-weight:700;margin-bottom:8px;
  letter-spacing:-.1px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;
}
.doc-preview{
  font-size:12.5px;color:var(--muted);line-height:1.6;
  margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;
  min-height:36px;
}
.doc-meta{
  display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;
  color:var(--muted);font-weight:600;margin-bottom:5px;
}
.doc-meta .dim{opacity:.75}
.doc-actions{
  display:flex;gap:6px;margin-top:auto;padding-top:12px;
  border-top:1px dashed var(--line);
  opacity:0;transition:opacity .18s;
}
.doc-card:hover .doc-actions,
.doc-card:focus-within .doc-actions{opacity:1}

.drag-handle{
  position:absolute;top:14px;right:14px;
  width:22px;height:22px;border-radius:6px;
  display:grid;place-items:center;
  color:var(--drag-handle);font-size:14px;font-weight:900;
  letter-spacing:-1px;line-height:1;
  transition:.15s;opacity:0;
}
.doc-card:hover .drag-handle{opacity:1}
.doc-card.draggable .drag-handle{color:var(--drag-handle-hover)}
.doc-card.draggable:hover .drag-handle{color:var(--accent);background:var(--hover-bg)}

.editor-wrap{max-width:820px;margin:0 auto}
.editor-hint{
  background:var(--hint-bg);
  border:1px solid var(--hint-border);border-radius:14px;
  padding:14px 18px;font-size:13px;color:var(--hint-text);
  line-height:1.75;margin-bottom:16px;
}
.editor-hint b{color:var(--hint-strong)}
.title-row{
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
}
.title-row label{
  font-size:12px;font-weight:800;color:var(--muted);
  letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;
}
.title-input{
  flex:1;font-family:inherit;font-size:15px;font-weight:600;
  padding:10px 14px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);
  color:var(--ink);outline:none;transition:.15s;
}
.title-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent)}
.title-input::placeholder{color:var(--muted);opacity:.6;font-weight:500}

.editor{
  width:100%;min-height:340px;resize:vertical;
  font-family:Georgia,"Times New Roman",serif;
  font-size:15.5px;line-height:1.75;color:var(--ink);
  padding:20px 22px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);
  outline:none;transition:.15s;
}
.editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent)}
.editor-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.editor-meta{
  font-size:12px;color:var(--muted);margin-top:10px;
  display:flex;gap:14px;font-weight:600;
}

.readbar{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;margin-bottom:14px;
  display:flex;flex-direction:column;gap:12px;
  position:relative;
}
.readbar-row{
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;
}
.readbar .label{
  font-size:11px;font-weight:800;color:var(--muted);
  letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;
  min-width:52px;
}
.sec-select{
  font-family:inherit;font-size:13px;font-weight:600;
  padding:7px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;
  max-width:min(380px,55vw);flex:1;min-width:160px;
}
.sec-select:disabled{opacity:.5;cursor:not-allowed}
.voice-select,.rate-select{
  font-family:inherit;font-size:12.5px;font-weight:600;
  padding:7px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;
}
.voice-select{max-width:min(320px,50vw);flex:1;min-width:150px}
.rate-select{min-width:82px}
.voice-select:disabled,.rate-select:disabled{opacity:.5;cursor:not-allowed}
.nav-info{
  font-size:12.5px;color:var(--muted);font-weight:700;
  font-variant-numeric:tabular-nums;margin-left:auto;
}
.nav-info.editing{
  color:var(--accent);
  font-weight:800;
  letter-spacing:.3px;
}
.density-range{
  flex:1;accent-color:var(--accent);height:5px;cursor:pointer;min-width:120px;
}
.density-range:disabled{opacity:.4;cursor:not-allowed}
.dval{
  font-size:13px;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;min-width:44px;text-align:right;
}
.firstletter-badge{
  font-size:10.5px;font-weight:800;
  padding:3px 9px;border-radius:999px;letter-spacing:.3px;white-space:nowrap;
  border:none;cursor:pointer;font-family:inherit;
  background:var(--badge-bg);color:var(--badge-text);
  transition:background .15s, opacity .15s, color .15s;
}
.firstletter-badge.off{background:var(--badge-off-bg);color:var(--badge-off-text)}
.firstletter-badge:disabled{cursor:not-allowed;opacity:.55}

.voice-note{
  font-size:11.5px;color:var(--muted);font-weight:600;
  margin-left:auto;white-space:nowrap;
}

.prefs-panel{
  position:absolute;top:calc(100% + 8px);right:16px;
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;
  box-shadow:var(--shadow-panel);
  z-index:60;
  display:none;
  min-width:280px;
}
.prefs-panel.open{display:block}
.prefs-row{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.prefs-row:last-child{margin-bottom:0}
.prefs-label{
  font-size:11px;font-weight:800;color:var(--muted);
  letter-spacing:.5px;text-transform:uppercase;
  min-width:38px;
}
.prefs-opt{
  border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:5px 11px;border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.prefs-opt:hover{border-color:var(--accent);color:var(--accent)}
.prefs-opt.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
}

/* ---------- 段落看板（双列） ---------- */
.overview-panel{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;margin-bottom:18px;
  overflow:hidden;
  transition:background .25s, border-color .25s;
}
.overview-head{
  display:flex;align-items:center;gap:10px;
  padding:11px 16px;
  border-bottom:1px solid transparent;
  cursor:pointer;user-select:none;
  transition:border-color .2s, background .15s;
}
.overview-head:hover{background:var(--hover-bg)}
.overview-panel.open .overview-head{
  border-bottom-color:var(--line);
}
.overview-title{
  font-size:12px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted);
}
.overview-count{
  font-size:11.5px;font-weight:700;
  background:var(--mastered-bg);color:var(--mastered-text);
  padding:3px 10px;border-radius:999px;
  border:1px solid var(--mastered-border);
}
.overview-arrow{
  margin-left:auto;
  font-size:11px;color:var(--muted);font-weight:900;
  transition:transform .2s;
}
.overview-panel.open .overview-arrow{transform:rotate(180deg)}

.overview-body{
  display:none;
  padding:10px;
  gap:10px;
}
.overview-panel.open .overview-body{
  display:grid;
  grid-template-columns:1fr 1fr;
}
@media(max-width:560px){
  .overview-panel.open .overview-body{
    grid-template-columns:1fr;
  }
}

.ov-col{
  background:var(--bg);
  border:1px dashed var(--line);
  border-radius:11px;
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
  min-height:120px;
  max-height:380px;
  overflow-y:auto;
  transition:background .15s, border-color .15s, box-shadow .15s;
}
.ov-col-head{
  display:flex;align-items:center;gap:7px;
  padding:3px 4px 7px;
  font-size:11px;font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:1px solid var(--line);
  margin-bottom:2px;
  position:sticky;top:-8px;
  background:var(--bg);
  z-index:1;
  margin-left:-8px;margin-right:-8px;padding-left:12px;padding-right:12px;
}
.ov-col-count{
  font-size:10.5px;
  background:var(--chip-bg);color:var(--chip-text);
  padding:2px 7px;border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.ov-col-done{
  background:var(--mastered-bg);
  border-color:var(--mastered-border);
}
.ov-col-done .ov-col-head{
  background:var(--mastered-bg);
  color:var(--mastered-text);
  border-bottom-color:var(--mastered-border);
}
.ov-col-done .ov-col-count{
  background:var(--mastered-border);color:#fff;
}
html[data-theme="dark"] .ov-col-done .ov-col-count{color:#0f1a12;}
.ov-col.over{
  background:var(--chip-bg);
  border-color:var(--accent);
  border-style:solid;
  box-shadow:0 0 0 2px var(--accent) inset;
}
.ov-col-empty{
  text-align:center;
  font-size:11.5px;
  color:var(--muted);
  padding:20px 8px;
  font-style:italic;
}

.ov-card{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 8px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  cursor:grab;
  user-select:none;
  transition:border-color .15s, box-shadow .15s, transform .15s, opacity .15s;
}
.ov-card:hover{
  border-color:var(--accent);
  box-shadow:0 2px 8px rgba(15,118,110,.08);
}
.ov-card:active{cursor:grabbing;}
.ov-card.dragging{
  opacity:0.35;
  transform:scale(0.97);
}
.ov-card.mastered{
  background:var(--mastered-bg);
  border-color:var(--mastered-border);
}
.ov-card.current{
  box-shadow:0 0 0 2px var(--accent) inset;
}

.ov-check{
  flex:none;
  width:22px;height:22px;
  border-radius:6px;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--muted);
  display:grid;place-items:center;
  font-size:12px;font-weight:900;
  cursor:pointer;font-family:inherit;
  transition:all .15s;
  padding:0;
}
.ov-check:hover{border-color:var(--ok);color:var(--ok);}
.ov-card.mastered .ov-check{
  background:var(--mastered-border);
  border-color:var(--mastered-border);
  color:#fff;
}
html[data-theme="dark"] .ov-card.mastered .ov-check{color:#0f1a12;}

.ov-body{
  flex:1;
  min-width:0;
  display:flex;align-items:baseline;gap:7px;
  cursor:pointer;
}
.ov-num{
  flex:none;
  font-size:10.5px;font-weight:800;
  color:var(--accent);
  background:var(--chip-bg);
  padding:2px 6px;border-radius:5px;
  font-variant-numeric:tabular-nums;
}
.ov-preview{
  flex:1;min-width:0;
  font-size:12px;color:var(--muted);
  font-weight:500;
  line-height:1.4;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ov-card.mastered .ov-preview{color:var(--mastered-text);}

.ov-del{
  flex:none;
  width:24px;height:24px;
  border-radius:6px;
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  cursor:pointer;font-family:inherit;
  font-size:12px;line-height:1;
  display:grid;place-items:center;
  transition:all .15s;
  padding:0;
}
.ov-del:hover{
  background:#fef2f2;
  border-color:#fca5a5;
  color:var(--warn);
}
html[data-theme="dark"] .ov-del:hover{
  background:rgba(248,113,113,.15);
  border-color:rgba(248,113,113,.4);
  color:#f87171;
}

.reading{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:30px 34px;font-family:Georgia,"Times New Roman",serif;
  font-size:var(--reading-size);
  line-height:var(--reading-line);
  color:var(--ink);
  transition:background .25s, color .25s;
}
.l2-sent{margin:0 0 .8em}
.l2-sent:last-child{margin-bottom:0}

.wd{
  cursor:pointer;border-radius:4px;padding:0 1px;
  transition:background .12s, box-shadow .18s, color .12s;
}
.wd:hover{background:var(--hover-bg)}
.wd.speaking{
  background:var(--speaking-bg);
  box-shadow:0 0 0 3px var(--speaking-shadow);
  border-radius:5px;
}
.wd .hw-mask{
  color:var(--mask-text);letter-spacing:.5px;background:var(--mask-bg);
  border-bottom:2px dotted var(--mask-border);padding:0 3px;border-radius:3px;
}
.wd .hw-real{
  display:none;color:var(--real-text);font-weight:700;background:var(--real-bg);
  padding:0 3px;border-radius:3px;
}
.wd.masked.revealed .hw-real,
.reading.show-all .wd .hw-real{display:inline}

<body>

<header class="topbar">
  <div class="brand" id="brand">消失的墨水 <span class="sub">Fading Ink</span></div>
  <div class="spacer"></div>
  <div id="topbarActions"></div>
</header>

<main id="view"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<script>
/* =========================================================
   存储键
   ========================================================= */
const STORAGE_LIBRARY = 'fading-ink-library-v1';
const STORAGE_VOICE   = 'fading-ink-voice-v1';
const STORAGE_PREFS   = 'fading-ink-prefs-v1';
const STORAGE_LEGACY  = 'fading-ink-text-v1';

const TITLE_MAX_LEN = 60;
const FALLBACK_DELAY_MS = 800;

const SAMPLE_TEXT =
`Learning a new language is a rewarding journey. It opens doors to different cultures and helps you connect with more people.

Every day, practice a little. Read a short article, listen to a podcast, or write a few sentences about your day.

Mistakes are normal and important. They show that you are trying, and they help your brain remember the correct form.

Stay patient and keep going. Progress may feel slow, but small steps add up over time.`;

/* =========================================================
   工具
   ========================================================= */
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function createDocId(){
  return 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}

function autoTitle(text){
  if (!text) return '未命名文档';
  const firstLine = text.split('\n').map(s => s.trim()).find(Boolean) || '';
  const clean = firstLine.replace(/\s+/g, ' ').trim();
  if (!clean) return '未命名文档';
  return clean.length > TITLE_MAX_LEN
    ? clean.slice(0, TITLE_MAX_LEN) + '…'
    : clean;
}

function formatTime(ts){
  if (!ts) return '';
  const diff = Date.now() - ts;
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return '刚刚';
  const min = Math.floor(sec / 60);
  if (min < 60) return min + ' 分钟前';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + ' 小时前';
  const day = Math.floor(hr / 24);
  if (day < 30) return day + ' 天前';
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* =========================================================
   偏好设置
   ========================================================= */
const DEFAULT_PREFS = {
  theme: 'auto',
  fontSize: 18,
  lineHeight: 2.15,
  speechRate: 0.85
};

function loadPrefs(){
  try {
    const raw = localStorage.getItem(STORAGE_PREFS);
    if (!raw) return {...DEFAULT_PREFS};
    const obj = JSON.parse(raw);
    return {
      theme: ['auto','light','dark'].includes(obj.theme) ? obj.theme : DEFAULT_PREFS.theme,
      fontSize: typeof obj.fontSize === 'number' ? obj.fontSize : DEFAULT_PREFS.fontSize,
      lineHeight: typeof obj.lineHeight === 'number' ? obj.lineHeight : DEFAULT_PREFS.lineHeight,
      speechRate: typeof obj.speechRate === 'number' ? obj.speechRate : DEFAULT_PREFS.speechRate
    };
  } catch(_) { return {...DEFAULT_PREFS}; }
}
function savePrefs(){
  try { localStorage.setItem(STORAGE_PREFS, JSON.stringify(state.prefs)); } catch(_) {}
}

/* =========================================================
   库存储
   ========================================================= */
function loadLibrary(){
  try {
    const raw = localStorage.getItem(STORAGE_LIBRARY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch(_) { return []; }
}
function saveLibrary(docs){
  try { localStorage.setItem(STORAGE_LIBRARY, JSON.stringify(docs)); } catch(_) {}
}
function ensureDocOrder(docs){
  let needSave = false;
  docs.forEach((d, i) => {
    if (typeof d.order !== 'number') { d.order = i; needSave = true; }
    if (!Array.isArray(d.masteredSecs)) { d.masteredSecs = []; needSave = true; }
  });
  if (needSave) saveLibrary(docs);
}
function sortedDocs(docs){
  return [...docs].sort((a, b) => {
    const ao = typeof a.order === 'number' ? a.order : 999999;
    const bo = typeof b.order === 'number' ? b.order : 999999;
    return ao - bo;
  });
}

/* =========================================================
   文本解析
   ========================================================= */
function parseText(raw){
  let blocks = raw.split(/\n\s*\n+/).map(b => b.trim()).filter(Boolean);
  if (blocks.length <= 1) {
    const single = raw.split(/\n+/).map(b => b.trim()).filter(Boolean);
    if (single.length > 1) blocks = single;
  }
  return blocks.map((block, idx) => {
    const sentences = block.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
    return {
      title: 'Part ' + (idx + 1),
      preview: block.replace(/\s+/g, ' ').slice(0, 60),
      sentences: sentences.length ? sentences : [block]
    };
  });
}

function rebuildTextFromSections(sections){
  return sections.map(s => s.sentences.join(' ')).join('\n\n');
}

const WORD_RE = /[A-Za-z0-9][A-Za-z0-9'’\-]*/g;

/* =========================================================
   难度评分
   ========================================================= */
function wordDifficulty(word){
  const len = word.length;
  if (len <= 4) return 0;
  if (len >= 8) return 1;
  return (len - 4) / 4;
}

function buildMaskSet(sentences, density){
  const allWords = [];
  sentences.forEach((sent, si) => {
    const re = new RegExp(WORD_RE.source, 'g');
    let m;
    while ((m = re.exec(sent)) !== null) {
      allWords.push({
        si,
        pos: m.index,
        diff: wordDifficulty(m[0])
      });
    }
  });

  const total = allWords.length;
  const need = Math.round(total * density);
  if (need <= 0) return new Set();

  const sorted = allWords.slice().sort((a, b) => b.diff - a.diff);

  const maskSet = new Set();
  for (let i = 0; i < need && i < sorted.length; i++) {
    maskSet.add(sorted[i].si + ':' + sorted[i].pos);
  }
  return maskSet;
}

/* =========================================================
   发音引擎
   ========================================================= */
const Speech = (() => {
  const supported = typeof window !== 'undefined' && 'speechSynthesis' in window;
  let cachedVoice = null;
  let voicesReady = false;
  let unlocked = false;
  let allVoices = [];
  let readyCbs = [];

  let kTimers = [];
  let kActiveEl = null;
  let kBoundaryMode = false;
  let kGeneration = 0;

  let paragraphActive = false;
  let paragraphStateCb = null;

  function setParagraphActive(v){
    if (paragraphActive === v) return;
    paragraphActive = v;
    if (paragraphStateCb) {
      try { paragraphStateCb(v); } catch(_){}
    }
  }

  function kClearTimers(){
    kTimers.forEach(clearTimeout);
    kTimers = [];
  }
  function kClearActive(){
    if (kActiveEl) {
      kActiveEl.classList.remove('karaoke-active');
      kActiveEl = null;
    }
  }
  function kSetActive(el){
    if (kActiveEl === el) return;
    if (kActiveEl) kActiveEl.classList.remove('karaoke-active');
    kActiveEl = el;
    if (el) el.classList.add('karaoke-active');
  }
  function stopKaraoke(){
    kGeneration++;
    kClearTimers();
    kClearActive();
    kBoundaryMode = false;
  }

  function notifyReady(){
    const cbs = readyCbs; readyCbs = [];
    cbs.forEach(cb => { try { cb(); } catch(_){} });
  }

  function loadVoices(){
    if (!supported) return false;
    try {
      const voices = window.speechSynthesis.getVoices();
      if (voices && voices.length) {
        allVoices = voices;
        if (!cachedVoice) {
          let saved = null;
          try { saved = localStorage.getItem(STORAGE_VOICE); } catch(_){}
          let picked = null;
          if (saved) picked = voices.find(v => v.name === saved) || null;
          if (!picked) {
            picked = voices.find(v => /^en[-_]US/i.test(v.lang)) ||
                     voices.find(v => /^en[-_]GB/i.test(v.lang)) ||
                     voices.find(v => /^en/i.test(v.lang)) ||
                     voices[0] || null;
          }
          cachedVoice = picked;
        }
        if (!voicesReady) { voicesReady = true; notifyReady(); }
        return true;
      }
    } catch(_){}
    return false;
  }

  if (supported) {
    loadVoices();
    let tries = 0;
    const poll = setInterval(() => {
      if (voicesReady || tries++ > 40) { clearInterval(poll); return; }
      loadVoices();
    }, 150);
    try {
      window.speechSynthesis.onvoiceschanged = () => {
        loadVoices();
        if (voicesReady) clearInterval(poll);
      };
    } catch(_){}
  }

  function getEnglishVoices(){
    if (!allVoices.length) loadVoices();
    return allVoices.filter(v => /^en/i.test(v.lang));
  }
  function getCurrentVoice(){ return cachedVoice; }
  function setVoiceByName(name){
    const v = allVoices.find(x => x.name === name);
    if (v) {
      cachedVoice = v;
      try { localStorage.setItem(STORAGE_VOICE, name); } catch(_){}
      return true;
    }
    return false;
  }
  function isReady(){ return voicesReady; }
  function onReady(cb){
    if (voicesReady) { try { cb(); } catch(_){} }
    else readyCbs.push(cb);
  }

  function clearMark(){
    document.querySelectorAll('.wd.speaking').forEach(n => n.classList.remove('speaking'));
  }

  function warmUnlock(){
    if (unlocked) return;
    unlocked = true;
    try {
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0; warm.rate = 1; warm.lang = 'en-US';
      window.speechSynthesis.speak(warm);
    } catch(_){}
  }

  function cancelCurrent(){
    try {
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
    } catch(_){}
  }

  function speak(word, el){
    if (!supported) { toast('当前浏览器不支持发音'); return; }
    if (!word) return;
    try {
      stopKaraoke();
      setParagraphActive(false);
      warmUnlock();
      if (!voicesReady) loadVoices();
      cancelCurrent();
      clearMark();

      const u = new SpeechSynthesisUtterance(word);
      u.lang = (cachedVoice && cachedVoice.lang) || 'en-US';
      u.rate = state.prefs.speechRate || 0.85;
      u.pitch = 1; u.volume = 1;
      if (cachedVoice) u.voice = cachedVoice;

      if (el) {
        el.classList.add('speaking');
        const cleanup = () => el.classList.remove('speaking');
        u.onend = cleanup; u.onerror = cleanup;
      }
      try { window.speechSynthesis.resume(); } catch(_) {}
      window.speechSynthesis.speak(u);
    } catch(err){
      clearMark();
      toast('发音失败，请重试');
    }
  }

  function speakParagraph(wordEls, onStateChange){
    if (!supported) { toast('当前浏览器不支持发音'); return; }
    if (!wordEls || !wordEls.length) return;

    try {
      stopKaraoke();
      warmUnlock();
      if (!voicesReady) loadVoices();
      cancelCurrent();
      clearMark();

      paragraphStateCb = onStateChange || null;

      const myGen = kGeneration;

      const wordMap = [];
      let text = '';
      wordEls.forEach((el, i) => {
        if (i > 0) text += ' ';
        const w = el.dataset.w || '';
        const start = text.length;
        text += w;
        wordMap.push({ start, end: text.length, el });
      });
      if (!wordMap.length) return;

      const rate = state.prefs.speechRate || 0.85;

      const u = new SpeechSynthesisUtterance(text);
      u.lang = (cachedVoice && cachedVoice.lang) || 'en-US';
      u.rate = rate;
      u.pitch = 1;
      u.volume = 1;
      if (cachedVoice) u.voice = cachedVoice;

      let fallbackStarted = false;

      function startFallbackTimers(){
        if (kBoundaryMode) return;
        let elapsed = 0;
        wordMap.forEach(w => {
          const len = (w.el.textContent || '').length;
          const dur = Math.max(200, len * 95 + 220) / Math.max(0.5, rate);
          const t = setTimeout(() => {
            if (myGen !== kGeneration) return;
            if (!kBoundaryMode) kSetActive(w.el);
          }, elapsed);
          kTimers.push(t);
          elapsed += dur;
        });
        kTimers.push(setTimeout(() => {
          if (myGen !== kGeneration) return;
          if (!kBoundaryMode) kClearActive();
        }, elapsed + 500));
      }

      function beginFallback(){
        if (fallbackStarted) return;
        fallbackStarted = true;
        if (myGen !== kGeneration) return;
        if (kBoundaryMode) return;
        startFallbackTimers();
      }

      u.onstart = () => {
        if (myGen !== kGeneration) return;
        kTimers.push(setTimeout(() => {
          if (myGen !== kGeneration) return;
          beginFallback();
        }, FALLBACK_DELAY_MS));
      };

      kTimers.push(setTimeout(() => {
        if (myGen !== kGeneration) return;
        beginFallback();
      }, 5000));

      u.onboundary = (e) => {
        if (myGen !== kGeneration) return;
        if (!kBoundaryMode) {
          kBoundaryMode = true;
          kClearTimers();
        }
        if (e.name && e.name !== 'word' && e.name !== 'sentence') return;
        const ci = e.charIndex || 0;
        let best = -1;
        for (let i = 0; i < wordMap.length; i++) {
          if (wordMap[i].start <= ci && ci < wordMap[i].end) { best = i; break; }
        }
        if (best === -1) {
          for (let i = 0; i < wordMap.length; i++) {
            if (wordMap[i].start >= ci) { best = i; break; }
          }
        }
        if (best >= 0) kSetActive(wordMap[best].el);
      };

      u.onend = () => {
        if (myGen !== kGeneration) return;
        kClearTimers();
        setTimeout(() => {
          if (myGen !== kGeneration) return;
          if (!window.speechSynthesis.speaking) {
            kClearActive();
            setParagraphActive(false);
          }
        }, 200);
      };
      u.onerror = () => {
        if (myGen !== kGeneration) return;
        kClearTimers();
        kClearActive();
        setParagraphActive(false);
      };

      try { window.speechSynthesis.resume(); } catch(_) {}
      window.speechSynthesis.speak(u);

      setParagraphActive(true);
    } catch(err){
      stopKaraoke();
      setParagraphActive(false);
      toast('播放失败');
    }
  }

  function stop(){
    if (!supported) {
      stopKaraoke();
      setParagraphActive(false);
      return;
    }
    try { window.speechSynthesis.cancel(); } catch(_){}
    clearMark();
    stopKaraoke();
    setParagraphActive(false);
  }

  function isParagraphPlaying(){
    return paragraphActive;
  }

  return { supported, speak, speakParagraph, stop, getEnglishVoices,
           getCurrentVoice, setVoiceByName, isReady, onReady,
           isParagraphPlaying };
})();

/* =========================================================
   全局状态
   ========================================================= */
const state = {
  view: 'library',
  docs: [],
  activeId: null,

  prefs: loadPrefs(),

  editorDocId: null,
  editorText: '',
  editorTitle: '',

  sections: [],
  secIdx: 0,
  density: 50,
  showAll: false,
  firstLetterDisabled: false,
  revealed: new Set(),

  overviewOpen: true,
  editingSecIdx: null
};

/* =========================================================
   主题与偏好
   ========================================================= */
const mqDark = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme(){
  const p = state.prefs;
  let effective = p.theme;
  if (p.theme === 'auto') effective = mqDark.matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = effective;
  updateThemeBtn();
}

function applyReadingPrefs(){
  const p = state.prefs;
  document.documentElement.style.setProperty('--reading-size', p.fontSize + 'px');
  document.documentElement.style.setProperty('--reading-line', p.lineHeight);
}

function cycleTheme(){
  const order = ['auto','light','dark'];
  const idx = order.indexOf(state.prefs.theme);
  state.prefs.theme = order[(idx + 1) % order.length];
  savePrefs();
  applyTheme();
  toast(
    state.prefs.theme === 'auto' ? '主题：跟随系统' :
    state.prefs.theme === 'light' ? '主题：浅色' : '主题：深色'
  );
}

function updateThemeBtn(){
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  const t = state.prefs.theme;
  if (t === 'auto') { btn.textContent = '🌗'; btn.title = '主题：跟随系统'; }
  else if (t === 'light') { btn.textContent = '☀️'; btn.title = '主题：浅色'; }
  else { btn.textContent = '🌙'; btn.title = '主题：深色'; }
}

try {
  mqDark.addEventListener('change', () => {
    if (state.prefs.theme === 'auto') applyTheme();
  });
} catch(_) {
  try {
    mqDark.addListener(() => {
      if (state.prefs.theme === 'auto') applyTheme();
    });
  } catch(_){}
}

/* =========================================================
   导入 / 导出
   ========================================================= */
function exportBackup(){
  if (!state.docs.length) { toast('库是空的，没有可导出的内容'); return; }
  const data = {
    app: 'fading-ink',
    version: 1,
    exportedAt: Date.now(),
    settings: {
      theme: state.prefs.theme,
      fontSize: state.prefs.fontSize,
      lineHeight: state.prefs.lineHeight,
      speechRate: state.prefs.speechRate,
      voice: Speech.getCurrentVoice() ? Speech.getCurrentVoice().name : null
    },
    docs: state.docs
  };
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `fading-ink-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`已导出 ${state.docs.length} 篇文稿`);
  } catch(err) {
    toast('导出失败');
  }
}

function openImportDialog(){
  const input = document.getElementById('fileInput');
  input.value = '';
  input.click();
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch(err) {
      toast('文件格式不正确');
      return;
    }
    if (!data || !Array.isArray(data.docs)) {
      toast('文件内容不是备份格式');
      return;
    }
    const count = data.docs.length;
    if (!confirm(`导入将替换当前库（${state.docs.length} 篇），确定吗？\n\n备份包含 ${count} 篇文稿。`)) return;

    state.docs = data.docs.map((d, i) => ({
      id: d.id || createDocId(),
      title: typeof d.title === 'string' ? d.title : '未命名文档',
      text: typeof d.text === 'string' ? d.text : '',
      createdAt: d.createdAt || Date.now(),
      lastOpenedAt: d.lastOpenedAt || Date.now(),
      lastSecIdx: typeof d.lastSecIdx === 'number' ? d.lastSecIdx : 0,
      density: typeof d.density === 'number' ? d.density : 50,
      order: typeof d.order === 'number' ? d.order : i,
      masteredSecs: Array.isArray(d.masteredSecs) ? d.masteredSecs : []
    })).filter(d => d.text.trim());
    ensureDocOrder(state.docs);
    saveLibrary(state.docs);

    if (data.settings && typeof data.settings === 'object') {
      const s = data.settings;
      if (['auto','light','dark'].includes(s.theme)) state.prefs.theme = s.theme;
      if (typeof s.fontSize === 'number' && s.fontSize >= 12 && s.fontSize <= 32) state.prefs.fontSize = s.fontSize;
      if (typeof s.lineHeight === 'number' && s.lineHeight >= 1.2 && s.lineHeight <= 3) state.prefs.lineHeight = s.lineHeight;
      if (typeof s.speechRate === 'number' && s.speechRate >= 0.5 && s.speechRate <= 1.5) state.prefs.speechRate = s.speechRate;
      savePrefs();
      applyTheme();
      applyReadingPrefs();
      if (s.voice) Speech.setVoiceByName(s.voice);
    }

    toast(`已导入 ${state.docs.length} 篇文稿`);
    state.view = 'library';
    render();
  };
  reader.onerror = () => toast('文件读取失败');
  reader.readAsText(file);
}

function persistReadState(){

/* =========================================================
   库视图
   ========================================================= */
let draggedId = null;

function renderLibrary(){
  const docs = state.docs;
  if (!docs.length) {
    view.innerHTML = `
      <div class="empty">
        <div class="big">📚</div>
        <h2>你的背诵库还空着</h2>
        <p>粘贴第一篇文稿，开始训练。</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn primary big" id="firstDocBtn">+ 新建第一篇</button>
          <button class="btn big" id="importEmptyBtn">📥 导入备份</button>
        </div>
      </div>
    `;
    document.getElementById('firstDocBtn').onclick = () => {
      state.editorDocId = null;
      state.editorText = '';
      state.editorTitle = '';
      state.view = 'edit';
      render();
    };
    document.getElementById('importEmptyBtn').onclick = openImportDialog;
    return;
  }

  const sorted = sortedDocs(docs);

  const cardsHtml = sorted.map(doc => {
    const wc = doc.text.split(/\s+/).filter(Boolean).length;
    const secCount = parseText(doc.text).length;
    const masteredCount = Array.isArray(doc.masteredSecs)
      ? doc.masteredSecs.filter(i => i >= 0 && i < secCount).length : 0;
    const lastIdx = typeof doc.lastSecIdx === 'number' ? doc.lastSecIdx : 0;
    const progress = lastIdx > 0
      ? `已看到第 ${Math.min(lastIdx + 1, secCount)} / ${secCount} 段`
      : `${secCount} 段 · 未开始`;
    const preview = doc.text.replace(/\s+/g, ' ').slice(0, 110);

    return `
      <div class="doc-card draggable" data-id="${doc.id}" draggable="true">
        <div class="drag-handle" title="拖拽排序">⋮⋮</div>
        <div class="doc-title">${esc(doc.title || '未命名文档')}</div>
        <div class="doc-preview">${esc(preview)}${doc.text.length > 110 ? '…' : ''}</div>
        <div class="doc-meta">
          <span>📝 ${wc} 词</span>
          <span>${esc(progress)}</span>
          ${masteredCount > 0 ? `<span style="color:var(--mastered-text)">✓ ${masteredCount} 已掌握</span>` : ''}
        </div>
        <div class="doc-meta">
          <span class="dim">打开于 ${esc(formatTime(doc.lastOpenedAt))}</span>
        </div>
        <div class="doc-actions">
          <button class="btn small" data-action="open">打开</button>
          <button class="btn small" data-action="edit">编辑</button>
          <button class="btn small danger" data-action="delete">删除</button>
        </div>
      </div>
    `;
  }).join('');

  view.innerHTML = `
    <div class="library-head">
      <h2>我的背诵库 <span class="count">(${docs.length})</span></h2>
      <span class="hint">⋮⋮ 拖拽卡片可手动排序</span>
      <div class="head-actions">
        <button class="btn small" id="importBtn" title="从 JSON 文件导入备份">📥 导入</button>
        <button class="btn small" id="exportBtn" title="把整个库导出为 JSON 备份">📤 导出</button>
      </div>
    </div>
    <div class="doc-grid" id="docGrid">${cardsHtml}</div>
  `;

  document.getElementById('importBtn').onclick = openImportDialog;
  document.getElementById('exportBtn').onclick = exportBackup;

  bindLibraryEvents();
}

function bindLibraryEvents(){
  const cards = view.querySelectorAll('.doc-card');

  cards.forEach(card => {
    card.addEventListener('click', e => {
      if (card.classList.contains('dragging')) return;
      const id = card.dataset.id;
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) { openDoc(id); return; }
      const act = actionEl.dataset.action;
      if (act === 'open') openDoc(id);
      else if (act === 'edit') editDoc(id);
      else if (act === 'delete') deleteDoc(id);
    });

    card.addEventListener('dragstart', e => {
      draggedId = card.dataset.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', draggedId); } catch(_){}
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      view.querySelectorAll('.drop-before, .drop-after')
        .forEach(el => el.classList.remove('drop-before', 'drop-after'));
      draggedId = null;
    });

    card.addEventListener('dragover', e => {
      if (!draggedId || draggedId === card.dataset.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      const rect = card.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      const before = e.clientY < midY;

      view.querySelectorAll('.drop-before, .drop-after').forEach(el => {
        if (el !== card) el.classList.remove('drop-before', 'drop-after');
      });
      card.classList.toggle('drop-before', before);
      card.classList.toggle('drop-after', !before);
    });

    card.addEventListener('dragleave', e => {
      if (!card.contains(e.relatedTarget)) {
        card.classList.remove('drop-before', 'drop-after');
      }
    });

    card.addEventListener('drop', e => {
      e.preventDefault();
      if (!draggedId || draggedId === card.dataset.id) return;
      const rect = card.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      const insertBefore = e.clientY < midY;
      reorderDocs(draggedId, card.dataset.id, insertBefore);
      card.classList.remove('drop-before', 'drop-after');
      draggedId = null;
    });
  });
}

function reorderDocs(dragId, targetId, insertBefore){
  if (dragId === targetId) return;

  const sorted = sortedDocs(state.docs);
  const dragged = sorted.find(d => d.id === dragId);
  if (!dragged) return;

  const without = sorted.filter(d => d.id !== dragId);
  let idx = without.findIndex(d => d.id === targetId);
  if (idx === -1) return;
  if (!insertBefore) idx += 1;

  without.splice(idx, 0, dragged);

  without.forEach((d, i) => { d.order = i; });
  saveLibrary(state.docs);

  renderLibrary();
  toast('顺序已保存');
}

function openDoc(id){
  const doc = state.docs.find(d => d.id === id);
  if (!doc) return;
  const sections = parseText(doc.text);
  if (!sections.length) { toast('文档内容为空'); return; }

  doc.lastOpenedAt = Date.now();
  saveLibrary(state.docs);

  state.activeId = id;
  state.sections = sections;
  state.secIdx = Math.min(doc.lastSecIdx || 0, sections.length - 1);
  state.density = typeof doc.density === 'number' ? doc.density : 50;
  state.showAll = false;
  state.firstLetterDisabled = false;
  state.revealed = new Set();
  state.editingSecIdx = null;
  state.view = 'read';
  render();
}

function editDoc(id){
  const doc = state.docs.find(d => d.id === id);
  if (!doc) return;
  state.editorDocId = id;
  state.editorText = doc.text;
  state.editorTitle = doc.title;
  state.view = 'edit';
  render();
}

function deleteDoc(id){
  const doc = state.docs.find(d => d.id === id);
  if (!doc) return;
  if (!confirm(`确定删除「${doc.title}」？此操作不可恢复。`)) return;
  state.docs = state.docs.filter(d => d.id !== id);
  saveLibrary(state.docs);
  toast('已删除');
  render();
}

function saveFromEditor(){
  const text = state.editorText.trim();
  if (!text) { toast('请先粘贴文本'); return; }

  const title = (state.editorTitle || '').trim() || autoTitle(text);
  const now = Date.now();

  let doc;
  if (state.editorDocId) {
    doc = state.docs.find(d => d.id === state.editorDocId);
    if (doc) {
      doc.text = text;
      doc.title = title;
      doc.lastOpenedAt = now;
      doc.lastSecIdx = 0;
      doc.masteredSecs = [];
    }
  }
  if (!doc) {
    state.docs.forEach(d => {
      d.order = (typeof d.order === 'number' ? d.order : 0) + 1;
    });
    doc = {
      id: createDocId(),
      title,
      text,
      createdAt: now,
      lastOpenedAt: now,
      lastSecIdx: 0,
      density: 50,
      order: 0,
      masteredSecs: []
    };
    state.docs.push(doc);
  }
  saveLibrary(state.docs);

  state.activeId = doc.id;
  state.sections = parseText(text);
  state.secIdx = 0;
  state.density = typeof doc.density === 'number' ? doc.density : 50;
  state.showAll = false;
  state.firstLetterDisabled = false;
  state.revealed = new Set();
  state.editingSecIdx = null;
  state.editorDocId = null;
  state.editorText = '';
  state.editorTitle = '';
  state.view = 'read';
  render();
  toast('已保存到背诵库');
}

/* =========================================================
   阅读视图
   ========================================================= */
function renderSentence(text, si, secIdx, maskSet, useFirstLetter){
  const re = new RegExp(WORD_RE.source, 'g');
  let result = '';
  let lastIndex = 0;
  let wIdx = 0;
  let m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > lastIndex) {
      result += esc(text.slice(lastIndex, m.index));
    }
    const word = m[0];
    const key = secIdx + '-' + si + '-' + wIdx;
    const isMasked = maskSet.has(si + ':' + m.index);
    const revealed = state.revealed.has(key);
    wIdx++;

    if (!isMasked) {
      result += `<span class="wd" data-w="${esc(word)}" data-key="${key}">${esc(word)}</span>`;
    } else {
      const useFirst = useFirstLetter;
      const mask = useFirst
        ? word[0] + '_'.repeat(Math.max(2, word.length - 1))
        : '_'.repeat(Math.max(3, word.length));
      const cls = 'wd masked' + (revealed ? ' revealed' : '');
      result += `<span class="${cls}" data-w="${esc(word)}" data-key="${key}">` +
                `<span class="hw-mask">${esc(mask)}</span>` +
                `<span class="hw-real">${esc(word)}</span></span>`;
    }
    lastIndex = m.index + word.length;
  }
  if (lastIndex < text.length) {
    result += esc(text.slice(lastIndex));
  }
  return result;
}

function readerBodyHtml(){
  const st = state;
  const sec = st.sections[st.secIdx];
  if (!sec) return '';
  const d = st.density / 100;
  const useFirstLetter = st.density >= 70 && !st.firstLetterDisabled;
  const maskSet = buildMaskSet(sec.sentences, d);
  return sec.sentences
    .map((s, si) => `<p class="l2-sent">${renderSentence(s, si, st.secIdx, maskSet, useFirstLetter)}</p>`)
    .join('');
}

/* ---------- 段落看板渲染（双列） ---------- */
function renderOverview(){
  const st = state;
  const doc = st.docs.find(d => d.id === st.activeId);
  if (!doc) return '';
  const mastered = Array.isArray(doc.masteredSecs) ? doc.masteredSecs : [];
  const total = st.sections.length;
  const masteredCount = mastered.filter(i => i >= 0 && i < total).length;

  const todoList = [];
  const doneList = [];
  for (let i = 0; i < total; i++) {
    if (mastered.includes(i)) doneList.push(i);
    else todoList.push(i);
  }

  const renderCard = (i) => {
    const sec = st.sections[i];
    const isMastered = mastered.includes(i);
    const isCurrent = i === st.secIdx;
    const cls = ['ov-card'];
    if (isMastered) cls.push('mastered');
    if (isCurrent) cls.push('current');
    return `
      <div class="${cls.join(' ')}" draggable="true" data-idx="${i}">
        <button class="ov-check" data-toggle="${i}" title="${isMastered ? '标为待学' : '标为已掌握'}">${isMastered ? '✓' : ''}</button>
        <div class="ov-body" data-jump="${i}">
          <span class="ov-num">${i + 1}</span>
          <span class="ov-preview">${esc(sec.preview)}${sec.preview.length >= 60 ? '…' : ''}</span>
        </div>
        <button class="ov-del" data-del="${i}" title="删除本段">🗑</button>
      </div>
    `;
  };

  const todoHtml = todoList.length
    ? todoList.map(renderCard).join('')
    : '<div class="ov-col-empty">全部已掌握 🎉</div>';
  const doneHtml = doneList.length
    ? doneList.map(renderCard).join('')
    : '<div class="ov-col-empty">拖动卡片到此处<br>标记为已掌握</div>';

  const panelCls = 'overview-panel' + (st.overviewOpen ? ' open' : '');

  return `
    <div class="${panelCls}" id="overviewPanel">
      <div class="overview-head" id="overviewHead">
        <span class="overview-title">段落看板</span>
        <span class="overview-count">${masteredCount} / ${total} 已掌握</span>
        <span class="overview-arrow">▼</span>
      </div>
      <div class="overview-body" id="overviewBody">
        <div class="ov-col ov-col-todo" data-col="todo">
          <div class="ov-col-head">
            <span>待学习</span>
            <span class="ov-col-count">${todoList.length}</span>
          </div>
          ${todoHtml}
        </div>
        <div class="ov-col ov-col-done" data-col="done">
          <div class="ov-col-head">
            <span>已掌握</span>
            <span class="ov-col-count">${doneList.length}</span>
          </div>
          ${doneHtml}
        </div>
      </div>
    </div>
  `;
}

/* ---------- 段落看板事件 ---------- */
function bindOverviewEvents(){
  const head = document.getElementById('overviewHead');
  if (head) {
    head.onclick = () => {
      state.overviewOpen = !state.overviewOpen;
      const panel = document.getElementById('overviewPanel');
      if (panel) panel.classList.toggle('open', state.overviewOpen);
    };
  }

  const body = document.getElementById('overviewBody');
  if (!body) return;

  body.onclick = e => {
    const toggleBtn = e.target.closest('[data-toggle]');
    if (toggleBtn) {
      e.stopPropagation();
      const idx = +toggleBtn.dataset.toggle;
      setMastered(idx, !isMastered(idx));
      return;
    }
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      e.stopPropagation();
      const idx = +delBtn.dataset.del;
      deleteSectionAt(idx);
      return;
    }
    const jumpEl = e.target.closest('[data-jump]');
    if (jumpEl) {
      e.stopPropagation();
      const idx = +jumpEl.dataset.jump;
      jumpToSection(idx);
      return;
    }
  };

  let dragIdx = null;

  body.querySelectorAll('.ov-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragIdx = +card.dataset.idx;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragIdx)); } catch(_){}
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      body.querySelectorAll('.ov-col.over').forEach(el => el.classList.remove('over'));
      dragIdx = null;
    });
  });

  body.querySelectorAll('.ov-col').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');
    });
    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) {
        col.classList.remove('over');
      }
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('over');
      if (dragIdx === null) return;
      const target = col.dataset.col;
      const shouldBeMastered = (target === 'done');
      if (isMastered(dragIdx) !== shouldBeMastered) {
        setMastered(dragIdx, shouldBeMastered);
      }
      dragIdx = null;
    });
  });
}

/* ---------- 已掌握状态 ---------- */
function isMastered(idx){
  const doc = state.docs.find(d => d.id === state.activeId);
  if (!doc || !Array.isArray(doc.masteredSecs)) return false;
  return doc.masteredSecs.includes(idx);
}

function setMastered(idx, value){
  const doc = state.docs.find(d => d.id === state.activeId);
  if (!doc) return;
  if (!Array.isArray(doc.masteredSecs)) doc.masteredSecs = [];
  const pos = doc.masteredSecs.indexOf(idx);
  if (value && pos < 0) {
    doc.masteredSecs.push(idx);
  } else if (!value && pos >= 0) {
    doc.masteredSecs.splice(pos, 1);
  } else {
    return;
  }
  saveLibrary(state.docs);
  refreshOverview();
}

function jumpToSection(idx){
  const st = state;
  if (idx < 0 || idx >= st.sections.length) return;
  if (st.secIdx === idx) return;
  Speech.stop();
  st.editingSecIdx = null;
  st.secIdx = idx;
  persistReadState();
  renderReader();
}

/* ---------- 删除段落 ---------- */
function deleteSectionAt(idx){
  const st = state;
  const doc = st.docs.find(d => d.id === st.activeId);
  if (!doc) return;
  if (idx < 0 || idx >= st.sections.length) return;

  const previewText = st.sections[idx].preview;
  if (!confirm(`确定删除第 ${idx + 1} 段？\n\n"${previewText}…"\n\n此操作不可恢复。`)) return;

  Speech.stop();
  st.editingSecIdx = null;

  const sections = st.sections.slice();
  sections.splice(idx, 1);

  doc.text = rebuildTextFromSections(sections);

  if (Array.isArray(doc.masteredSecs)) {
    doc.masteredSecs = doc.masteredSecs
      .filter(i => i !== idx)
      .map(i => i > idx ? i - 1 : i);
  }

  if (typeof doc.lastSecIdx === 'number' && doc.lastSecIdx >= sections.length) {
    doc.lastSecIdx = Math.max(0, sections.length - 1);
  }

  saveLibrary(state.docs);

  if (!sections.length) {
    toast('所有段落已删除，文档已空');
    state.view = 'library';
    state.docs = loadLibrary();
    render();
    return;
  }

  if (st.secIdx === idx) {
    st.secIdx = Math.max(0, idx - 1);
  } else if (st.secIdx > idx) {
    st.secIdx -= 1;
  }

  st.revealed = new Set();
  st.sections = sections;

  persistReadState();
  renderReader();
  toast(`已删除第 ${idx + 1} 段`);
}

function refreshOverview(){
  const oldPanel = document.getElementById('overviewPanel');
  if (!oldPanel) return;
  const wasOpen = oldPanel.classList.contains('open');

  const temp = document.createElement('div');
  temp.innerHTML = renderOverview();
  const newPanel = temp.firstElementChild;
  newPanel.classList.toggle('open', wasOpen);

  oldPanel.replaceWith(newPanel);
  bindOverviewEvents();
}

/* ---------- 段落文字编辑 ---------- */
function enterSectionEdit(){
  const st = state;
  if (st.editingSecIdx !== null) return;
  Speech.stop();
  updatePlayBtnState();
  st.editingSecIdx = st.secIdx;
  renderReader();
  setTimeout(() => {
    const ta = document.getElementById('sectionEditor');
    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }, 60);
}

function cancelSectionEdit(){
  state.editingSecIdx = null;
  renderReader();
}

function saveEditedSection(){
  const st = state;
  const doc = st.docs.find(d => d.id === st.activeId);
  if (!doc) return;
  const idx = st.editingSecIdx;
  if (idx === null || idx < 0 || idx >= st.sections.length) return;

  const textarea = document.getElementById('sectionEditor');
  if (!textarea) return;
  const newText = textarea.value.trim();
  if (!newText) { toast('段落内容不能为空'); return; }

  const oldText = st.sections[idx].sentences.join(' ');
  if (newText === oldText) {
    st.editingSecIdx = null;
    renderReader();
    toast('没有修改');
    return;
  }

  /* 二次确认 */
  const previewShort = newText.length > 100 ? newText.slice(0, 100) + '…' : newText;
  const ok = confirm(
    `确定要修改第 ${idx + 1} 段吗？\n\n` +
    `此修改会直接保存到文稿，无法撤销。\n\n` +
    `修改后的内容预览：\n${previewShort}`
  );
  if (!ok) return;

  /* 重新拆句 */
  const sentences = newText.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);

  const sections = st.sections.slice();
  sections[idx] = {
    title: sections[idx].title,
    preview: newText.replace(/\s+/g, ' ').slice(0, 60),
    sentences: sentences.length ? sentences : [newText]
  };

  doc.text = rebuildTextFromSections(sections);
  saveLibrary(st.docs);

  st.sections = sections;
  st.editingSecIdx = null;
  st.revealed = new Set();

  persistReadState();
  renderReader();
  toast(`第 ${idx + 1} 段已保存修改`);
}

function renderVoiceSelect(){
  const sel = document.getElementById('voiceSelect');
  if (!sel) return;
  const voices = Speech.getEnglishVoices();
  const current = Speech.getCurrentVoice();
  if (!voices.length) {
    sel.innerHTML = '<option>未检测到英语语音</option>';
    return;
  }
  sel.innerHTML = voices.map(v =>
    `<option value="${esc(v.name)}"${current && v.name === current.name ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`
  ).join('');
}

function updateVoiceNote(){
  const el = document.getElementById('voiceNote');
  if (!el) return;
  if (!Speech.supported) { el.textContent = '⚠ 浏览器不支持语音合成'; return; }
  const v = Speech.getCurrentVoice();
  el.textContent = v ? '当前：' + v.lang : '未检测到语音';
}

/* =========================================================
   阅读器主渲染
   ========================================================= */
function renderReader(){
  const st = state;
  if (!st.sections.length) {
    view.innerHTML = `<div class="empty">
      <div class="big">📄</div>
      <h2>文档为空</h2>
      <p>点击右上角「编辑」粘贴内容。</p>
    </div>`;
    return;
  }
  const sec = st.sections[st.secIdx];
  const total = st.sections.length;
  const isEditing = st.editingSecIdx === st.secIdx;
  const dis = isEditing ? ' disabled' : '';

  view.innerHTML = `
    <div class="readbar">
      <div class="readbar-row">
        <span class="label">段落</span>
        <select class="sec-select" id="secSelect"${dis}>
          ${st.sections.map((s, i) =>
            `<option value="${i}" ${i === st.secIdx ? 'selected' : ''}>${i + 1}. ${esc(s.preview)}${s.preview.length >= 60 ? '…' : ''}</option>`
          ).join('')}
        </select>
        ${isEditing
          ? `<span class="nav-info editing">✏️ 编辑中</span>`
          : `<button class="btn small" id="editSecBtn" title="编辑本段文字">✏️ 编辑本段</button>
             <span class="nav-info">${st.secIdx + 1} / ${total}</span>`}
      </div>
      <div class="readbar-row">
        <span class="label">遮蔽度</span>
        <input type="range" class="density-range" id="density" min="0" max="100" step="10" value="${st.density}"${dis}>
        <span class="dval" id="dval">${st.density}%</span>
        <button class="btn small firstletter-badge" id="firstLetterToggle"${dis}></button>
        <button class="btn small" id="peekBtn"${dis}>${st.showAll ? '🙈 重新遮蔽' : '👁 全部显示'}</button>
        <button class="btn small" id="prefsBtn" title="字号 / 行距"${dis}>Aa</button>
      </div>
      <div class="readbar-row">
        <span class="label">语音</span>
        <select class="voice-select" id="voiceSelect"${dis}>
          <option>加载中…</option>
        </select>
        <select class="rate-select" id="rateSelect"${dis} title="朗读速度">
          <option value="0.6">0.6x</option>
          <option value="0.8">0.8x</option>
          <option value="0.85">0.85x</option>
          <option value="1">1.0x</option>
          <option value="1.2">1.2x</option>
        </select>
        <button class="btn small" id="testVoice"${dis}>🔊 播放本段 (空格)</button>
        <span class="voice-note" id="voiceNote"></span>
      </div>

      <div class="prefs-panel" id="prefsPanel">
        <div class="prefs-row">
          <span class="prefs-label">字号</span>
          ${[
            {v:14, l:'小'},
            {v:16, l:'中'},
            {v:18, l:'标'},
            {v:20, l:'大'},
            {v:24, l:'特大'}
          ].map(o =>
            `<button class="prefs-opt${st.prefs.fontSize === o.v ? ' active' : ''}" data-size="${o.v}">${o.l}</button>`
          ).join('')}
        </div>
        <div class="prefs-row">
          <span class="prefs-label">行距</span>
          ${[
            {v:1.6, l:'紧'},
            {v:1.9, l:'标'},
            {v:2.15, l:'松'},
            {v:2.5, l:'很松'}
          ].map(o =>
            `<button class="prefs-opt${Math.abs(st.prefs.lineHeight - o.v) < 0.01 ? ' active' : ''}" data-line="${o.v}">${o.l}</button>`
          ).join('')}
        </div>
      </div>
    </div>

    ${isEditing ? '' : renderOverview()}

    <div class="reading${st.showAll && !isEditing ? ' show-all' : ''}" id="reading">
      ${isEditing ? renderSectionEditor() : readerBodyHtml()}
    </div>
    <div class="tip">
      ${isEditing
        ? '💡 段落内的句子用空格分隔即可。点「保存修改」后会二次确认，再写入文稿。'
        : '💡 点击单词听发音 · 点击遮蔽词显示/隐藏 · 空格播放/暂停 · 键盘 ← → 切换段落'}
    </div>
  `;

  updateFirstLetterBtn();
  updatePlayBtnState();
  if (!isEditing) bindOverviewEvents();

  /* 编辑本段按钮 */
  const editSecBtn = document.getElementById('editSecBtn');
  if (editSecBtn) {
    editSecBtn.onclick = enterSectionEdit;
  }

  /* 保存 / 取消编辑 */
  const saveEditBtn = document.getElementById('saveEditBtn');
  if (saveEditBtn) saveEditBtn.onclick = saveEditedSection;
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if (cancelEditBtn) cancelEditBtn.onclick = cancelSectionEdit;

  /* 首字母提示 */
  const firstLetterBtn = document.getElementById('firstLetterToggle');
  if (firstLetterBtn && !isEditing) {
    firstLetterBtn.onclick = () => {
      if (state.density < 70) {
        toast('遮蔽度需达到 70% 才能使用首字母提示');
        return;
      }
      state.firstLetterDisabled = !state.firstLetterDisabled;
      const reading = document.getElementById('reading');
      if (reading) reading.innerHTML = readerBodyHtml();
      updateFirstLetterBtn();
    };
  }

  /* 阅读偏好面板 */
  const prefsBtn = document.getElementById('prefsBtn');
  const prefsPanel = document.getElementById('prefsPanel');
  if (prefsBtn && prefsPanel && !isEditing) {
    prefsBtn.onclick = e => {
      e.stopPropagation();
      prefsPanel.classList.toggle('open');
    };
    prefsPanel.onclick = e => {
      e.stopPropagation();
      const sizeBtn = e.target.closest('[data-size]');
      const lineBtn = e.target.closest('[data-line]');
      if (sizeBtn) {
        const v = +sizeBtn.dataset.size;
        state.prefs.fontSize = v;
        savePrefs();
        applyReadingPrefs();
        prefsPanel.querySelectorAll('[data-size]').forEach(b =>
          b.classList.toggle('active', +b.dataset.size === v));
      } else if (lineBtn) {
        const v = +lineBtn.dataset.line;
        state.prefs.lineHeight = v;
        savePrefs();
        applyReadingPrefs();
        prefsPanel.querySelectorAll('[data-line]').forEach(b =>
          b.classList.toggle('active', Math.abs(+b.dataset.line - v) < 0.01));
      }
    };
  }

  renderVoiceSelect();
  Speech.onReady(() => {
    if (document.getElementById('voiceSelect')) {
      renderVoiceSelect();
      updateVoiceNote();
    }
  });
  updateVoiceNote();

  /* 语音选择 */
  const voiceSel = document.getElementById('voiceSelect');
  if (voiceSel && !isEditing) {
    voiceSel.onchange = e => {
      Speech.stop();
      updatePlayBtnState();
      if (Speech.setVoiceByName(e.target.value)) {
        toast('已切换语音引擎');
        updateVoiceNote();
      }
    };
  }

  /* 朗读速度 */
  const rateSel = document.getElementById('rateSelect');
  if (rateSel) {
    rateSel.value = String(state.prefs.speechRate);
    if (![...rateSel.options].some(o => Math.abs(+o.value - state.prefs.speechRate) < 0.001)) {
      const opt = document.createElement('option');
      opt.value = String(state.prefs.speechRate);
      opt.textContent = state.prefs.speechRate + 'x';
      rateSel.appendChild(opt);
      rateSel.value = String(state.prefs.speechRate);
    }
    if (!isEditing) {
      rateSel.onchange = () => {
        const v = +rateSel.value;
        state.prefs.speechRate = v;
        savePrefs();
        Speech.stop();
        updatePlayBtnState();
        toast('朗读速度：' + v + 'x');
      };
    }
  }

  /* 播放按钮 */
  const testBtn = document.getElementById('testVoice');
  if (testBtn && !isEditing) {
    testBtn.onclick = () => {
      if (Speech.isParagraphPlaying()) {
        Speech.stop();
        updatePlayBtnState();
        return;
      }
      const readingEl = document.getElementById('reading');
      const wordEls = [...readingEl.querySelectorAll('.wd')];
      if (!wordEls.length) return;
      Speech.speakParagraph(wordEls, () => {
        updatePlayBtnState();
      });
      updatePlayBtnState();
    };
  }

  /* 单词点击 */
  const reading = document.getElementById('reading');
  if (reading && !isEditing) {
    reading.onclick = e => {
      const wd = e.target.closest('.wd');
      if (!wd) return;
      if (wd.classList.contains('masked')) {
        const key = wd.dataset.key;
        if (wd.classList.contains('revealed')) {
          wd.classList.remove('revealed');
          st.revealed.delete(key);
        } else {
          wd.classList.add('revealed');
          st.revealed.add(key);
        }
      }
      Speech.speak(wd.dataset.w, wd);
      updatePlayBtnState();
    };
  }

  /* 段落切换 */
  const secSel = document.getElementById('secSelect');
  if (secSel && !isEditing) {
    secSel.onchange = e => {
      Speech.stop();
      st.editingSecIdx = null;
      st.secIdx = +e.target.value;
      persistReadState();
      renderReader();
    };
  }

  /* 遮蔽度滑块 */
  const range = document.getElementById('density');
  if (range && !isEditing) {
    range.oninput = e => {
      Speech.stop();
      st.density = +e.target.value;
      document.getElementById('dval').textContent = st.density + '%';
      reading.innerHTML = readerBodyHtml();
      if (st.density < 70) {
        st.firstLetterDisabled = false;
      }
      updateFirstLetterBtn();
      updatePlayBtnState();
      persistReadState();
    };
  }

  /* 全部显示 */
  const peekBtn = document.getElementById('peekBtn');
  if (peekBtn && !isEditing) {
    peekBtn.onclick = () => {
      st.showAll = !st.showAll;
      reading.classList.toggle('show-all', st.showAll);
      if (!st.showAll) {
        const prefix = st.secIdx + '-';
        [...st.revealed].forEach(k => {
          if (k.startsWith(prefix)) st.revealed.delete(k);
        });
        reading.querySelectorAll('.wd.revealed').forEach(n => n.classList.remove('revealed'));
      }
      document.getElementById('peekBtn').textContent = st.showAll ? '🙈 重新遮蔽' : '👁 全部显示';
    };
  }
}

/* =========================================================
   键盘：空格播放/暂停，←→ 翻段
   ========================================================= */
document.addEventListener('keydown', e => {
  if (state.view !== 'read') return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;

  /* 编辑状态下，不响应快捷键 */
  if (state.editingSecIdx !== null) return;

  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    const btn = document.getElementById('testVoice');
    if (btn) btn.click();
    return;
  }

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    Speech.stop();

    const st = state;
    if (e.key === 'ArrowLeft') {
      st.secIdx = (st.secIdx - 1 + st.sections.length) % st.sections.length;
    } else {
      st.secIdx = (st.secIdx + 1) % st.sections.length;
    }
    persistReadState();
    renderReader();
  }
});

/* =========================================================
   全局点击：关闭偏好面板
   ========================================================= */
document.addEventListener('click', () => {
  const panel = document.getElementById('prefsPanel');
  if (panel && panel.classList.contains('open')) {
    panel.classList.remove('open');
  }
});

/* =========================================================
   品牌点击回库
   ========================================================= */
document.getElementById('brand').onclick = () => {
  Speech.stop();
  if (state.view === 'read') persistReadState();
  state.view = 'library';
  state.docs = loadLibrary();
  render();
};

/* =========================================================
   导入文件选择器
   ========================================================= */
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (file) handleImportFile(file);
});

/* =========================================================
   启动
   ========================================================= */
(function init(){
  applyTheme();
  applyReadingPrefs();

  state.docs = loadLibrary();

  try {
    const legacy = localStorage.getItem(STORAGE_LEGACY);
    if (legacy && legacy.trim() && state.docs.length === 0) {
      const doc = {
        id: createDocId(),
        title: autoTitle(legacy),
        text: legacy,
        createdAt: Date.now(),
        lastOpenedAt: Date.now(),
        lastSecIdx: 0,
        density: 50,
        order: 0,
        masteredSecs: []
      };
      state.docs.push(doc);
      saveLibrary(state.docs);
      localStorage.removeItem(STORAGE_LEGACY);
    }
  } catch(_){}

  ensureDocOrder(state.docs);

  state.view = 'library';
  render();
})();
</script>
